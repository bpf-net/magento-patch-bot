"$schema" = "./node_modules/wrangler/config-schema.json"

name = "magento-patch-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
preview_urls = false
send_metrics = false
upload_source_maps = true

[triggers]
crons = ["0 6 * * *"]

[[kv_namespaces]]
binding = "STATE"

[[workflows]]
name = "magento-patch-bot-check"
binding = "CHECK"
class_name = "CheckWorkflow"

[observability]
enabled = true

[secrets]
required = ["ADMIN_TOKEN"]
